# meeting-room-booking — dev compose
# Phase 0: รันเฉพาะ Postgres สำหรับ development
# รอบ deploy (Phase 6) จะเพิ่ม service backend + frontend ในไฟล์นี้
#
# ใช้งาน:  docker compose up -d db
# หยุด:    docker compose down  (ข้อมูลคงอยู่ใน volume)

services:
  db:
    image: postgres:16-alpine
    container_name: mrb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_room}
      POSTGRES_USER: ${POSTGRES_USER:-mrb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mrb_dev_password}
    ports:
      # 5434: OrbStack ใช้ 127.0.0.1:5432 ส่งต่อไปยัง orb machine อื่น จึงต้องเลี่ยง
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mrb} -d ${POSTGRES_DB:-meeting_room}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
